wording_scale:
  weak:
    preferred:
      - "may"
      - "is consistent with"
      - "suggests"
  moderate:
    preferred:
      - "supports"
      - "improves under the evaluated conditions"
      - "is associated with"
  strong:
    caution:
      - "demonstrates"
      - "causes"
      - "proves"
      - "establishes the mechanism"

mechanism_evidence_levels:
  M0: "No mechanism evidence; endpoint outcome only."
  M1: "Mechanism-consistent correlation or diagnostic change."
  M2: "Discriminating evidence against a strong alternative."
  M3: "Intervention or mediation evidence tied to the mechanism."
  M4: "Multiple converging lines of strong causal/mechanistic evidence."

